[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hust-it4613-recsys"
version = "0.1.0"
description = "Offline data pipeline for the HUST recommender-systems project"
requires-python = ">=3.11"
dependencies = [
    "implicit>=0.7.2,<0.8",
    "numpy>=1.26,<3",
    "pyarrow>=17,<22",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
recsys-data = "backend.data.cli:main"
recsys-cf = "backend.cf.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
