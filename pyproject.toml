[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hust-it4613-recsys"
version = "0.1.0"
description = "Offline data pipeline for the HUST recommender-systems project"
requires-python = ">=3.11"
dependencies = [
    "implicit>=0.7.2,<0.8",
    "numpy>=1.26,<3",
    "pyarrow>=17,<22",
    "python-dotenv>=1.2,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<0.15",
]
search = [
    "openai>=3.20,<4",
    "opensearch-py>=3.2,<4",
]

[project.scripts]
recsys-data = "backend.data.cli:main"
recsys-cf = "backend.cf.cli:main"
recsys-item-knn = "backend.item_knn.cli:main"
recsys-profile = "backend.profile.cli:main"
recsys-recommend = "backend.recommender.cli:main"
recsys-evaluate = "backend.recommender.evaluation_cli:main"
recsys-search = "backend.search.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
