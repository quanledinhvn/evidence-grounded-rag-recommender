<div id="exp-negative-d-viz">
  <h2>Đồ thị của e<sup>−d</sup></h2>

  <div class="viz-controls">
    <label class="form-label" for="exp-d-slider">
      Chọn d: <strong id="exp-d-value" class="tabular-nums">0.0</strong>
    </label>
    <input id="exp-d-slider" class="form-range" type="range" min="-4" max="4" step="0.1" value="0" aria-label="Giá trị d">
  </div>

  <div class="viz-row exp-readout" aria-live="polite">
    <span>e<sup>−d</sup> = <strong id="exp-result" class="tabular-nums">1.000</strong></span>
    <span id="exp-meaning" class="text-muted">d = 0 nên giá trị bằng 1</span>
  </div>

  <div id="exp-chart-wrap">
    <svg id="exp-chart" role="img" aria-labelledby="exp-chart-title exp-chart-desc">
      <title id="exp-chart-title">Đường cong e mũ trừ d</title>
      <desc id="exp-chart-desc">Đường cong giảm nhanh: d âm cho giá trị lớn, d bằng 0 cho giá trị 1, d dương cho giá trị tiến dần về 0.</desc>
    </svg>
  </div>
</div>

<style>
  #exp-negative-d-viz {
    color: var(--foreground);
    width: 100%;
  }

  #exp-negative-d-viz .exp-readout {
    justify-content: space-between;
    margin: 8px 0 10px;
  }

  #exp-negative-d-viz #exp-chart-wrap {
    width: 100%;
  }

  #exp-negative-d-viz #exp-chart {
    display: block;
    width: 100%;
  }

  #exp-negative-d-viz .plot-frame,
  #exp-negative-d-viz .grid-line,
  #exp-negative-d-viz .axis-line {
    fill: none;
    stroke: var(--border);
    stroke-width: 1;
  }

  #exp-negative-d-viz .curve {
    fill: none;
    stroke: var(--viz-series-1);
    stroke-width: 3;
  }

  #exp-negative-d-viz .guide {
    stroke: var(--muted-foreground);
    stroke-width: 1;
    stroke-dasharray: 4 4;
  }

  #exp-negative-d-viz .active-point {
    fill: var(--viz-series-1);
    stroke: var(--background);
    stroke-width: 3;
  }

  #exp-negative-d-viz .key-point {
    fill: var(--foreground);
  }

  #exp-negative-d-viz text {
    fill: var(--foreground);
    font-size: 12px;
  }

  #exp-negative-d-viz .tick-label,
  #exp-negative-d-viz .annotation {
    fill: var(--muted-foreground);
  }
</style>

<script>
(() => {
  const root = document.getElementById('exp-negative-d-viz');
  const svg = root.querySelector('#exp-chart');
  const wrap = root.querySelector('#exp-chart-wrap');
  const slider = root.querySelector('#exp-d-slider');
  const dValue = root.querySelector('#exp-d-value');
  const result = root.querySelector('#exp-result');
  const meaning = root.querySelector('#exp-meaning');

  const ns = 'http://www.w3.org/2000/svg';
  let geometry = null;

  function el(name, attrs = {}, text = '') {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    if (text) node.textContent = text;
    return node;
  }

  function draw() {
    const width = Math.max(320, Math.round(wrap.getBoundingClientRect().width));
    const height = width < 480 ? 300 : 340;
    const margin = { top: 18, right: 24, bottom: 52, left: 64 };
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const x = d => margin.left + ((d + 4) / 8) * plotW;
    const y = value => margin.top + (1 - value / Math.exp(4)) * plotH;

    geometry = { x, y, height, margin, plotW, plotH };
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('height', height);
    svg.querySelectorAll(':scope > :not(title):not(desc)').forEach(node => node.remove());

    svg.appendChild(el('rect', {
      class: 'plot-frame',
      'data-chart-frame': '',
      x: margin.left,
      y: margin.top,
      width: plotW,
      height: plotH
    }));

    [-4, -2, 0, 2, 4].forEach(tick => {
      const tickX = x(tick);
      svg.appendChild(el('line', {
        class: 'grid-line',
        x1: tickX,
        y1: margin.top,
        x2: tickX,
        y2: margin.top + plotH
      }));
      svg.appendChild(el('text', {
        class: 'tick-label',
        x: tickX,
        y: margin.top + plotH + 22,
        'text-anchor': 'middle'
      }, String(tick)));
    });

    [0, 10, 20, 30, 40, 50].forEach(tick => {
      const tickY = y(tick);
      svg.appendChild(el('line', {
        class: 'grid-line',
        x1: margin.left,
        y1: tickY,
        x2: margin.left + plotW,
        y2: tickY
      }));
      svg.appendChild(el('text', {
        class: 'tick-label',
        x: margin.left - 10,
        y: tickY + 4,
        'text-anchor': 'end'
      }, String(tick)));
    });

    const points = [];
    for (let index = 0; index <= 160; index += 1) {
      const d = -4 + index * 0.05;
      points.push(`${index === 0 ? 'M' : 'L'}${x(d).toFixed(2)},${y(Math.exp(-d)).toFixed(2)}`);
    }
    svg.appendChild(el('path', { class: 'curve', d: points.join(' ') }));

    [-2, 0, 2].forEach(d => {
      const value = Math.exp(-d);
      svg.appendChild(el('circle', {
        class: 'key-point',
        cx: x(d),
        cy: y(value),
        r: 3.5
      }));
      svg.appendChild(el('text', {
        class: 'annotation',
        x: x(d) + (d === 2 ? -8 : 8),
        y: y(value) - 9,
        'text-anchor': d === 2 ? 'end' : 'start'
      }, `d=${d}: ${value.toFixed(3)}`));
    });

    svg.appendChild(el('text', {
      class: 'axis-title',
      'data-axis': 'x',
      x: margin.left + plotW / 2,
      y: height - 10,
      'text-anchor': 'middle'
    }, 'd = điểm positive − điểm negative'));

    svg.appendChild(el('text', {
      class: 'axis-title',
      'data-axis': 'y',
      transform: `translate(16 ${margin.top + plotH / 2}) rotate(-90)`,
      'text-anchor': 'middle'
    }, 'e^(−d)'));

    svg.appendChild(el('line', { class: 'guide', id: 'exp-guide' }));
    svg.appendChild(el('circle', { class: 'active-point', id: 'exp-active-point', r: 6 }));
    update();
  }

  function update() {
    if (!geometry) return;
    const d = Number(slider.value);
    const value = Math.exp(-d);
    const pointX = geometry.x(d);
    const pointY = geometry.y(value);
    const guide = svg.querySelector('#exp-guide');
    const point = svg.querySelector('#exp-active-point');

    guide.setAttribute('x1', pointX);
    guide.setAttribute('x2', pointX);
    guide.setAttribute('y1', pointY);
    guide.setAttribute('y2', geometry.margin.top + geometry.plotH);
    point.setAttribute('cx', pointX);
    point.setAttribute('cy', pointY);

    dValue.textContent = d.toFixed(1);
    result.textContent = value.toFixed(3);
    meaning.textContent = d < 0
      ? 'd âm → giá trị tăng rất nhanh'
      : d > 0
        ? 'd dương → giá trị tiến dần về 0'
        : 'd = 0 nên giá trị bằng 1';
  }

  slider.addEventListener('input', update);
  new ResizeObserver(draw).observe(wrap);
  draw();
})();
</script>
