name: it4613-search

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    restart: unless-stopped

    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"

      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g

    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"

    volumes:
      - opensearch-data:/usr/share/opensearch/data

    ulimits:
      memlock:
        soft: -1
        hard: -1

      nofile:
        soft: 65536
        hard: 65536

    mem_limit: 3g
    cpus: 2.0

    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  opensearch-data:
