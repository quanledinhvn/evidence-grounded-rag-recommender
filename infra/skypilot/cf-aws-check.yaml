name: it4613-cf-check

resources:
  infra: aws/ap-southeast-1
  cpus: 4+
  memory: 32+
  use_spot: false
  disk_size: 30
  disk_tier: medium

envs:
  DATASET: movies-tv-2023
  RUN_NAME: cf-movies-tv-2023-check
  S3_BUCKET: null
  RUN_ID: null

workdir: .

file_mounts:
  /cf-input: artifacts/${DATASET}
  /mnt/cf-results:
    name: ${S3_BUCKET}
    store: s3
    mode: MOUNT

setup: |
  set -euo pipefail

  sudo apt-get update
  sudo apt-get install --yes libgomp1

  curl -LsSf https://astral.sh/uv/0.8.22/install.sh | sh
  export PATH="$HOME/.local/bin:$PATH"

  uv python install 3.12
  uv sync --frozen --python 3.12

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"

  if [[ ! "$RUN_ID" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
    printf 'Invalid RUN_ID: %s\n' "$RUN_ID" >&2
    exit 2
  fi

  local_output="$HOME/cf-results/$RUN_NAME/$RUN_ID"
  s3_run_dir="/mnt/cf-results/runs/$RUN_NAME/$RUN_ID"

  archive_artifacts() {
    local train_status="$?"
    local copy_status=0
    local marker_status=0

    local marker="FAILED"

    trap - EXIT
    set +e

    mkdir -p "$s3_run_dir"
    copy_status="$?"

    if [[ "$copy_status" -eq 0 ]]; then
      cp -R "$local_output/." "$s3_run_dir/"
      copy_status="$?"
    fi

    if [[ "$train_status" -eq 0 && "$copy_status" -eq 0 ]]; then
      marker="SUCCESS"
    fi

    rm -f "$s3_run_dir/SUCCESS" "$s3_run_dir/FAILED"
    touch "$s3_run_dir/$marker"
    marker_status="$?"

    if [[ "$copy_status" -eq 0 ]]; then
      copy_status="$marker_status"
    fi

    if [[ "$train_status" -ne 0 ]]; then
      exit "$train_status"
    fi

    exit "$copy_status"
  }

  trap archive_artifacts EXIT

  test -f /cf-input/splits.parquet
  test -f /cf-input/catalog.parquet

  mkdir -p "$local_output"
  date -u +"started_at=%Y-%m-%dT%H:%M:%SZ" | tee "$local_output/run-metadata.txt"
  uname -a | tee -a "$local_output/run-metadata.txt"
  uv run --frozen python -c \
    'import implicit; print(f"implicit_version={implicit.__version__}")' \
    | tee -a "$local_output/run-metadata.txt"

  output_uri="s3://$S3_BUCKET/runs/$RUN_NAME/$RUN_ID/"
  printf 'run_id=%s\ns3_output_uri=%s\n' "$RUN_ID" "$output_uri" \
    | tee -a "$local_output/run-metadata.txt"

  printf 'S3 output: %s\n' "$output_uri"

  uv run --frozen recsys-cf train \
    --splits /cf-input/splits.parquet \
    --catalog /cf-input/catalog.parquet \
    --output-dir "$local_output" \
    --phase validation \
    --factors 32 \
    --learning-rate 0.01 \
    --regularization 0.001 \
    --epochs 1 \
    --num-threads 0 \
    --seed 42 \
    2>&1 | tee "$local_output/train.log"

  date -u +"finished_at=%Y-%m-%dT%H:%M:%SZ" | tee -a "$local_output/run-metadata.txt"
  printf 'Completed. S3 output: %s\n' "$output_uri"
